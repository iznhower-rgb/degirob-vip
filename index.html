<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DeGirob VIP</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- شاشة الدفع -->
  <div id="paywall" class="screen active">
    <div class="paywall-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1 class="paywall-title">DeGirob VIP</h1>
    <p class="paywall-sub">Elite Tactical Intelligence</p>
    <input type="text" id="keyInput" class="key-input" placeholder="ENTER LICENSE KEY">
    
    <!-- 🚀 الزر يعمل الآن بشكل مباشر بدون ملفات خارجية -->
    <button class="unlock-btn" onclick="
      var key = document.getElementById('keyInput').value.trim().toUpperCase();
      if(key === 'DEGIROB-2026' || key === 'VIP-ALPHA-001') {
        document.getElementById('paywall').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
        document.getElementById('bottomNav').style.display = 'flex';
      } else {
        alert('❌ Invalid Key. Try: DEGIROB-2026');
      }
    ">UNLOCK ACCESS</button>
    
    <p class="paywall-hint">Demo: DEGIROB-2026</p>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="dashboard" class="screen">
    <header><div class="logo"><span class="logo-dot"></span>DeGirob VIP</div></header>
    <main>
      <div class="section-label">Golden Picks</div>
      <div id="goldenPicks">
        <div style="background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border); margin-bottom:10px;">
          <h3 style="color:var(--pos); font-size:16px;">Arsenal vs Chelsea</h3>
          <p style="color:var(--text-2); font-size:12px; margin-top:5px;">EV: +12.4% | Market: Clean</p>
        </div>
        <div style="background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border);">
          <h3 style="color:var(--pos); font-size:16px;">Real Madrid vs Barcelona</h3>
          <p style="color:var(--text-2); font-size:12px; margin-top:5px;">EV: +8.7% | Market: Clean</p>
        </div>
      </div>
    </main>
  </div>

  <!-- شريط التنقل -->
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <div class="nav-item active"><span>🏠</span><span>Home</span></div>
  </nav>

</body>
</html>
