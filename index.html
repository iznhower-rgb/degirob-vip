<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DeGirob VIP</title>
  <style>
    :root { --bg: #080B14; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1); --text: #F5F5F7; --text-2: #8B92A8; --purple: #7C3AED; --cyan: #06B6D4; --pos: #10B981; --neg: #F43F5E; --vip: #F59E0B; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .paywall { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 20px; }
    .logo { width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, var(--purple), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 20px; }
    h1 { color: #fff; margin-bottom: 10px; font-size: 28px; }
    p { color: var(--text-2); font-size: 13px; margin-bottom: 30px; }
    input { width: 100%; max-width: 300px; padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: #fff; text-align: center; font-size: 16px; margin-bottom: 15px; font-family: monospace; }
    button { width: 100%; max-width: 300px; padding: 15px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--purple), var(--cyan)); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    /* شاشة المباريات */
    #dashboard { display: none; width: 100%; max-width: 500px; padding: 20px; }
    .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: right; }
    .match-teams { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 10px; color: #fff; }
    .match-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--pos); font-weight: bold; }
  </style>
</head>
<body>

  <div id="paywall" class="paywall">
    <div class="logo">🛡️</div>
    <h1>DeGirob VIP</h1>
    <p>Elite Tactical Intelligence</p>
    <input type="text" id="keyInput" placeholder="ENTER KEY">
    <button onclick="unlock()">UNLOCK ACCESS</button>
    <p style="margin-top:20px; font-family:monospace;">Demo: DEGIROB-2026</p>
  </div>

  <div id="dashboard">
    <div class="match-card">
      <div class="match-teams"><span>Arsenal</span><span>VS</span><span>Chelsea</span></div>
      <div class="match-info"><span>Premier League</span><span>+12.4% EV</span></div>
    </div>
    <div class="match-card">
      <div class="match-teams"><span>Real Madrid</span><span>VS</span><span>Barcelona</span></div>
      <div class="match-info"><span>La Liga</span><span>+8.7% EV</span></div>
    </div>
    <div class="match-card">
      <div class="match-teams"><span>Inter</span><span>VS</span><span>Juventus</span></div>
      <div class="match-info"><span>Serie A</span><span>+6.2% EV</span></div>
    </div>
  </div>

  <script>
    function unlock() {
      if (document.getElementById('keyInput').value.trim().toUpperCase() === 'DEGIROB-2026') {
        document.getElementById('paywall').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
      } else {
        alert('Invalid Key');
      }
    }
  </script>
</body>
</html>
