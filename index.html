<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DeGirob VIP</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/detail.css">
</head>
<body>

  <!-- Paywall -->
  <div id="paywall" class="screen active">
    <div class="paywall-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 class="paywall-title">DeGirob VIP</h1>
    <p class="paywall-sub">Elite Tactical Intelligence</p>
    <input type="text" id="keyInput" class="key-input" placeholder="ENTER LICENSE KEY">
    <button class="unlock-btn" id="unlockBtn">UNLOCK ACCESS</button>
    <p class="paywall-hint">Demo: DEGIROB-2026</p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen">
    <header>
      <div class="logo"><span class="logo-dot"></span>DeGirob VIP</div>
      <div class="header-actions"><button class="icon-btn" id="langBtn">EN</button></div>
    </header>
    <main>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" id="statPicks">0</div><div class="stat-lbl">Picks</div></div>
        <div class="stat-card"><div class="stat-val" id="statAcc" style="color:var(--pos)">0%</div><div class="stat-lbl">Accuracy</div></div>
        <div class="stat-card"><div class="stat-val" id="statEV" style="color:var(--vip)">0%</div><div class="stat-lbl">Avg EV</div></div>
      </div>
      <div class="section-label">Golden Picks</div>
      <div id="goldenPicks"></div>
    </main>
  </div>

  <!-- Detail -->
  <div id="detail" class="screen">
    <div class="detail-header">
      <button class="icon-btn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="detail-title">Match Analysis</div>
    </div>
    <div class="detail-body" id="detailContent"></div>
  </div>

  <!-- Navigation -->
  <nav class="bottom-nav" id="bottomNav" style="display:none">
    <div class="nav-item active"><span>🏠</span><span>Home</span></div>
  </nav>

  <!-- Scripts (الترتيب مهم جداً) -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data/demo.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n/ar.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/ui/helpers.js"></script>
  <script src="js/ui/navigation.js"></script>
  <script src="js/screens/paywall.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
